<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Halaman login dengan validasi form JavaScript - Portofolio Suci Dian Azzahra.">
  <title>Login | Suci Dian Azzahra</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= LAYAR LOGIN ================= -->
  <div class="login-wrapper d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

          <!-- Tombol kembali ke beranda -->
          <a href="index.html" class="text-white-50 text-decoration-none d-inline-flex align-items-center mb-3">
            <i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda
          </a>

          <div class="card login-card p-4 p-md-5">
            <!-- Judul -->
            <div class="text-center mb-4">
              <span class="brand-logo mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">S</span>
              <h3 class="fw-bold mt-3 mb-1">Selamat Datang</h3>
              <p class="text-muted-soft mb-0">Masuk ke akun portofolio Anda</p>
            </div>

            <!-- Kotak pesan (alert). Disembunyikan dulu, diisi oleh JavaScript. -->
            <div id="formAlert" class="alert d-none" role="alert"></div>

            <!-- Form login. novalidate mematikan validasi bawaan browser
                 agar validasi sepenuhnya dilakukan oleh JavaScript. -->
            <form id="loginForm" novalidate>

              <!-- Input Email -->
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <div class="input-group has-validation">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope text-primary"></i></span>
                  <input type="email" class="form-control" id="email" name="email"
                         placeholder="nama@email.com" autocomplete="username">
                  <div class="invalid-feedback" id="emailError"></div>
                </div>
              </div>

              <!-- Input Password -->
              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group has-validation">
                  <span class="input-group-text bg-white"><i class="bi bi-lock text-primary"></i></span>
                  <input type="password" class="form-control" id="password" name="password"
                         placeholder="Minimal 8 karakter" autocomplete="current-password">
                  <!-- Tombol lihat/sembunyikan password -->
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1"
                          aria-label="Tampilkan atau sembunyikan password">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                  </button>
                  <div class="invalid-feedback" id="passwordError"></div>
                </div>
              </div>

              <!-- Ingat saya & lupa password -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="ingat">
                  <label class="form-check-label text-muted-soft" for="ingat">Ingat saya</label>
                </div>
                <a href="#" class="link-primary small">Lupa password?</a>
              </div>

              <!-- Tombol Login -->
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
              </button>
            </form>

            <p class="text-center text-muted-soft mt-4 mb-0 small">
              Belum punya akun? <a href="about.html" class="link-primary">Hubungi saya</a>
            </p>
          </div>

          <!-- Info aturan validasi -->
          <div class="card mt-3 p-3">
            <p class="mb-0 small text-muted-soft">
              <i class="bi bi-info-circle text-primary me-1"></i>
              Validasi: email harus berformat benar (contoh: <strong>nama@email.com</strong>) dan
              password minimal <strong>8 karakter</strong>.
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS khusus validasi login -->
  <script src="js/login.js"></script>
</body>
</html>
